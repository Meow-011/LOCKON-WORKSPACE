# =============================================================================
# LOCKON Workspace — Docker Compose (Base)
# =============================================================================
# Usage:
#   Development:  docker compose -f docker-compose.yml -f docker-compose.without-nginx.yml up -d
#   Production:   docker compose -f docker-compose.yml -f docker-compose.nginx.yml -f docker-compose.production.yml up -d
# =============================================================================

services:
  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG}
    restart: ${RESTART_POLICY}
    security_opt:
      - no-new-privileges:true
    mem_limit: 2G
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    volumes:
      - ${POSTGRES_DATA_PATH}:/var/lib/postgresql
    environment:
      - TZ
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  mattermost:
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: ./source
      dockerfile: Dockerfile
    image: lockon-workspace:latest
    restart: ${RESTART_POLICY}
    security_opt:
      - no-new-privileges:true
    mem_limit: 2G
    read_only: ${MATTERMOST_CONTAINER_READONLY}
    tmpfs:
      - /tmp
    volumes:
      - ${MATTERMOST_CONFIG_PATH}:/mattermost/config:rw
      - ${MATTERMOST_DATA_PATH}:/mattermost/data:rw
      - ${MATTERMOST_LOGS_PATH}:/mattermost/logs:rw
      - ${MATTERMOST_PLUGINS_PATH}:/mattermost/plugins:rw
      - ${MATTERMOST_CLIENT_PLUGINS_PATH}:/mattermost/client/plugins:rw
      - ${MATTERMOST_BLEVE_INDEXES_PATH}:/mattermost/bleve-indexes:rw
    environment:
      - TZ
      - MM_SQLSETTINGS_DRIVERNAME
      - MM_SQLSETTINGS_DATASOURCE
      - MM_BLEVESETTINGS_INDEXDIR
      - MM_SERVICESETTINGS_SITEURL
      - MM_LOGSETTINGS_CONSOLELEVEL
    healthcheck:
      test: ["CMD", "/mattermost/bin/mattermost", "version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - frontend
      - backend

# Network isolation: postgres is only accessible from backend network
networks:
  frontend:
    name: lockon-frontend
  backend:
    name: lockon-backend
    internal: true
