# =============================================================================
# LOCKON Workspace — Grafana Datasource Provisioning
# =============================================================================
# Auto-configures Prometheus as default datasource on first Grafana startup

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: '15s'
