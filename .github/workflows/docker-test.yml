name: Docker Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-compose-files:
    name: Validate Docker Compose Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup environment file
        run: |
          cp env.example .env
          # Replace placeholder passwords for CI testing
          sed -i 's/<CHANGE_ME_GENERATE_STRONG_PASSWORD>/ci_test_password_32chars_long!!/g' .env

      - name: Validate base docker-compose file
        run: docker compose config --quiet

      - name: Validate docker-compose with NGINX
        run: docker compose -f docker-compose.yml -f docker-compose.nginx.yml config --quiet

      - name: Validate docker-compose without NGINX
        run: docker compose -f docker-compose.yml -f docker-compose.without-nginx.yml config --quiet

      - name: Validate docker-compose production
        run: docker compose -f docker-compose.yml -f docker-compose.nginx.yml -f docker-compose.production.yml config --quiet

  test-docker-deployment:
    name: Test Docker Deployment
    runs-on: ubuntu-latest
    needs: validate-compose-files
    steps:
      - uses: actions/checkout@v4

      - name: Create required directories
        run: |
          mkdir -p ./volumes/app/mattermost/{config,data,logs,plugins,client/plugins,bleve-indexes}
          sudo chown -R 2000:2000 ./volumes/app/mattermost

      - name: Setup environment file
        run: |
          cp env.example .env
          sed -i 's/<CHANGE_ME_GENERATE_STRONG_PASSWORD>/ci_test_password_32chars_long!!/g' .env

      - name: Start Mattermost without NGINX
        run: |
          docker compose -f docker-compose.yml -f docker-compose.without-nginx.yml up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for Postgres to be healthy..."
          timeout 120 bash -c 'until docker compose ps postgres | grep -q "healthy"; do sleep 5; done'
          echo "Postgres is healthy!"

          echo "Waiting for Mattermost to start (up to 3 minutes)..."
          sleep 90
          docker compose ps

      - name: Check container logs
        run: |
          docker compose logs mattermost --tail 30
          docker compose logs postgres --tail 10

      - name: Verify Mattermost API is accessible
        run: |
          curl -f --retry 10 --retry-delay 5 --retry-connrefused http://localhost:8065/api/v4/system/ping || exit 1

      - name: Stop containers
        run: docker compose down
        if: always()
