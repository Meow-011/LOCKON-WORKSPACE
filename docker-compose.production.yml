# =============================================================================
# LOCKON Workspace — Production Overlay (with Monitoring)
# =============================================================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.nginx.yml -f docker-compose.production.yml up -d
#
# This overlay adds:
#   - Production-grade Mattermost settings
#   - Prometheus metrics collection
#   - Grafana dashboards
# =============================================================================

services:
  # Production overrides for Mattermost
  mattermost:
    environment:
      - MM_LOGSETTINGS_CONSOLELEVEL=INFO
      - MM_SERVICESETTINGS_ENABLEDEVELOPER=false
      - MM_SERVICESETTINGS_ENABLETESTING=false
      - MM_METRICSSETTINGS_ENABLE=true
      - MM_METRICSSETTINGS_LISTENADDRESS=:8067

  # --- Monitoring Stack ---
  prometheus:
    image: prom/prometheus:latest
    restart: ${RESTART_POLICY}
    security_opt:
      - no-new-privileges:true
    mem_limit: 512M
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    restart: ${RESTART_POLICY}
    security_opt:
      - no-new-privileges:true
    mem_limit: 512M
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - TZ
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-lockon_grafana}
      - GF_USERS_ALLOW_SIGN_UP=false
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend
      - backend

volumes:
  prometheus_data:
    name: lockon-prometheus-data
  grafana_data:
    name: lockon-grafana-data
